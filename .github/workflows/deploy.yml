name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # Search Console and Bing Webmaster ownership tokens, set under
          # Settings → Secrets and variables → Actions → Variables. Either may
          # be absent; the meta tag is simply not issued.
          GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
          BING_SITE_VERIFICATION: ${{ vars.BING_SITE_VERIFICATION }}

      - name: Preserve CNAME
        run: echo "www.akshaybajpai.com" > out/CNAME

      # IndexNow proves the key by fetching /<key>.txt from the site, so the
      # key file ships with the set. The key is a repository variable; it is
      # public by design (the file is), which is why it is not a secret.
      - name: Issue the IndexNow key file
        if: vars.INDEXNOW_KEY != ''
        run: echo "$INDEXNOW_KEY" > "out/$INDEXNOW_KEY.txt"
        env:
          INDEXNOW_KEY: ${{ vars.INDEXNOW_KEY }}

      - name: Verify artifact
        run: |
          ls -la out/
          test -f out/index.html
          test -f out/CNAME

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Retry delay (1/2)
        if: steps.deployment.outcome == 'failure'
        run: sleep 60

      - name: Deploy to GitHub Pages (retry 1)
        if: steps.deployment.outcome == 'failure'
        id: deploy_retry1
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Retry delay (2/2)
        if: steps.deploy_retry1.outcome == 'failure'
        run: sleep 60

      - name: Deploy to GitHub Pages (retry 2)
        if: steps.deploy_retry1.outcome == 'failure'
        id: deploy_retry2
        uses: actions/deploy-pages@v4

      - name: Fail if all deploys failed
        if: always() && steps.deployment.outcome == 'failure' && steps.deploy_retry1.outcome == 'failure' && steps.deploy_retry2.outcome == 'failure'
        run: |
          echo "::error::Deployment failed after 3 attempts."
          exit 1

  # Tell the engines that share IndexNow (Bing, Yandex, Naver, Seznam, and
  # through Bing's index DuckDuckGo and the Copilot/ChatGPT search layers)
  # that the set was reissued. Google does not take IndexNow; it reads the
  # sitemap. Every sheet in the sitemap is submitted: the set is small, the
  # protocol allows ten thousand per call, and a changed sheet is usually
  # many sheets (its neighbours' adjacency, the index, the feed). The job
  # cannot fail the deploy; a missed ping costs a crawl, not the site.
  notify:
    name: Notify IndexNow
    runs-on: ubuntu-latest
    needs: deploy
    if: vars.INDEXNOW_KEY != ''
    steps:
      - name: Submit the sitemap's URLs
        env:
          INDEXNOW_KEY: ${{ vars.INDEXNOW_KEY }}
          HOST: www.akshaybajpai.com
        run: |
          # The CDN may serve the previous build for up to ten minutes, so
          # the key file is awaited before the ping, which checks it.
          for i in $(seq 1 20); do
            if [ "$(curl -s "https://$HOST/$INDEXNOW_KEY.txt")" = "$INDEXNOW_KEY" ]; then break; fi
            sleep 30
          done

          urls=$(curl -sf "https://$HOST/sitemap.xml" | grep -o '<loc>[^<]*' | sed 's/<loc>//')
          count=$(printf '%s\n' "$urls" | grep -c .)
          list=$(printf '%s\n' "$urls" | sed 's/.*/"&"/' | paste -sd, -)

          body=$(printf '{"host":"%s","key":"%s","keyLocation":"https://%s/%s.txt","urlList":[%s]}' \
            "$HOST" "$INDEXNOW_KEY" "$HOST" "$INDEXNOW_KEY" "$list")
          status=$(curl -s -o /tmp/indexnow.txt -w '%{http_code}' \
            -H 'Content-Type: application/json; charset=utf-8' \
            -d "$body" https://api.indexnow.org/indexnow)

          case "$status" in
            200|202) echo "IndexNow accepted $count URLs (HTTP $status)";
                     echo "**IndexNow** · $count URLs submitted · HTTP $status" >> "$GITHUB_STEP_SUMMARY" ;;
            *)       echo "::warning::IndexNow answered HTTP $status: $(cat /tmp/indexnow.txt)";
                     echo "**IndexNow** · not accepted · HTTP $status" >> "$GITHUB_STEP_SUMMARY" ;;
          esac
